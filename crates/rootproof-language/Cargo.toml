[package]
name = "rootproof-language"
version = "0.1.0"
edition = "2024"

[dependencies]
rootproof-core = { path = "../rootproof-core" }
rootproof-git =  { path = "../rootproof-git" }
rootproof-executor = { path = "../rootproof-executor" }
